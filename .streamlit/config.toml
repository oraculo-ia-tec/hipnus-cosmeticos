# .streamlit/config.toml — TÁLYA COSMÉTICOS
# Configurações do servidor Streamlit para produção (Streamlit Cloud)
# e desenvolvimento local.

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#b76e79"
backgroundColor = "#fbf6f2"
secondaryBackgroundColor = "#f1e4da"
textColor = "#3a2620"
font = "sans serif"
