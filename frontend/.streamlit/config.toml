# Tema base do Streamlit — paleta institucional Tálya (warm rose / gold).
[theme]
base = "light"
primaryColor = "#b76e79"          # rosa Tálya (destaque/CTA)
backgroundColor = "#fbf6f2"
secondaryBackgroundColor = "#f1e4da"
textColor = "#3a2620"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
